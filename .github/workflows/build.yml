name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string
      zip_url:
        description: 'URL file ZIP'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download ZIP
        run: |
          curl -L -o project.zip "${{ inputs.zip_url }}"
          mkdir -p webapp
          unzip -q project.zip -d webapp/
          ls -la webapp/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          rm commandlinetools-linux-*.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"
        env:
          ANDROID_HOME: /opt/android-sdk

      - name: Build APK with Bubblewrap
        run: |
          npm install -g @bubblewrap/cli
          
          if [ ! -f webapp/manifest.json ]; then
            echo '{"name":"${{ inputs.app_name }}","short_name":"${{ inputs.app_name }}","start_url":"index.html","display":"standalone"}' > webapp/manifest.json
          fi
          
          mkdir -p app && cd app
          npx @bubblewrap/cli init --manifest=../webapp/manifest.json --directory=./android --name="${{ inputs.app_name }}" --packageName="com.${{ inputs.app_name }}"
          mkdir -p android/app/src/main/assets/public
          cp -r ../webapp/* android/app/src/main/assets/public/
          cd android && chmod +x gradlew && ./gradlew assembleDebug
        env:
          ANDROID_HOME: /opt/android-sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}
          path: app/android/app/build/outputs/apk/debug/*.apk
